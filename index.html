<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101828">
  <meta name="description" content="A catalog-driven certification study workspace.">
  <title>CertLab Study</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="app-shell" aria-live="polite">
    <main class="loading-screen"><div class="loader"></div><h1>Loading your study catalog</h1><p>Preparing courses, objectives, and practice questions.</p></main>
  </div>
  <noscript>This study app needs JavaScript enabled.</noscript>
  <!-- config.js is an optional, ignored local override. Production uses /api/config. -->
  <script src="config.js" onerror="this.remove()"></script>
  <script type="module">
    (async () => {
      try {
        const response = await fetch('/api/config', { cache: 'no-store' });
        if (response.ok) {
          const runtimeConfig = await response.json();
          if (runtimeConfig.url && runtimeConfig.anonKey) {
            window.CERTLAB_SUPABASE_CONFIG = Object.freeze(runtimeConfig);
          }
        }
      } catch (_) {
        // Local static-server use can rely on the optional config.js override.
      }
      await import('./lib/app.js');
    })();
  </script>
</body>
</html>
